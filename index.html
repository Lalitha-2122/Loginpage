<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      padding: 40px;
      width: 320px;
      text-align: center;
    }

    .container img {
      width: 175px;
      margin-bottom: 30px;
    }

    .container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
    }

    .container button {
      width: 100%;
      padding: 10px;
      background-color: #3897f0;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      height: 1px;
      width: 40%;
      background-color: #ccc;
      position: absolute;
      top: 50%;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .divider span {
      padding: 0 10px;
      background: #fff;
      color: #999;
      font-size: 14px;
    }

    .fb-login {
      color: #385185;
      text-decoration: none;
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    .forgot {
      color: #00376b;
      text-decoration: none;
      font-size: 12px;
      display: block;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://1000logos.net/wp-content/uploads/2017/02/Logo-Instagram.png" alt="Instagram Logo">
    <form>
      <input type="text" placeholder="Phone number, username, or email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
      <div class="divider"><span>OR</span></div>
      <a href="#" class="fb-login">Log in with Facebook</a>
      <a href="#" class="forgot">Forgot password?</a>
    </form>
  </div>
</body>
</html>
